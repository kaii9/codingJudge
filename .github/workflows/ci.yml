name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://codingjudge:codingjudge@localhost:5432/codingjudge_test?sslmode=disable
      TEST_REDIS_ADDR: localhost:6379
      TEST_MINIO_ENDPOINT: localhost:9000
      TEST_MINIO_ACCESS_KEY: minioadmin
      TEST_MINIO_SECRET_KEY: minioadmin
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: codingjudge_test
          POSTGRES_USER: codingjudge
          POSTGRES_PASSWORD: codingjudge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codingjudge -d codingjudge_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: start MinIO
        run: |
          docker run -d --name ci-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 60); do
            curl -fsS http://localhost:9000/minio/health/ready && exit 0
            sleep 1
          done
          docker logs ci-minio
          exit 1
      - run: go test ./...
      - run: go test -race ./internal/judge ./internal/judgeworker ./internal/store
      - run: go test -tags=integration ./internal/store ./internal/queue ./internal/objectstore
      - run: go vet ./...
      - name: smoke MinIO asset path
        run: |
          docker pull python:3.12-alpine
          bash scripts/smoke-minio-assets.sh

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build

  observability:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: check prometheus config
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v $PWD/deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro \
            -v $PWD/deploy/prometheus/prometheus.rules.yml:/etc/prometheus/prometheus.rules.yml:ro \
            prom/prometheus:v3.13.0 check config /etc/prometheus/prometheus.yml
      - name: check compose with loadtest profile
        run: |
          echo 'services: { api: { build: ".", command: ["true"] }, postgres: { image: "postgres:16-alpine" }, redis: { image: "redis:7-alpine" } }' > docker-compose.ci.yml
          docker compose -f docker-compose.ci.yml -f docker-compose.yml --profile loadtest config --quiet
