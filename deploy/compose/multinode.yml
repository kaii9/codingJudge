services:
  docker-daemon-a:
    image: docker:27.5.1-dind
    privileged: true
    command: ["--host=unix:///var/run/docker.sock", "--host=tcp://0.0.0.0:2375", "--tls=false"]
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - executor-a-docker:/var/lib/docker
      - executor-a-work:/workspace/codingjudge-sandbox
    healthcheck:
      test: ["CMD-SHELL", "docker info >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  docker-daemon-b:
    image: docker:27.5.1-dind
    privileged: true
    command: ["--host=unix:///var/run/docker.sock", "--host=tcp://0.0.0.0:2375", "--tls=false"]
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - executor-b-docker:/var/lib/docker
      - executor-b-work:/workspace/codingjudge-sandbox
    healthcheck:
      test: ["CMD-SHELL", "docker info >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  judge-images:
    environment:
      DOCKER_HOST: tcp://docker-daemon-a:2375
    command:
      - sh
      - -ec
      - |
        for image in golang:1.25-alpine python:3.12-alpine gcc:13; do
          if ! docker image inspect "$$image" >/dev/null 2>&1; then
            if DOCKER_HOST=unix:///var/run/host-docker.sock docker image inspect "$$image" >/dev/null 2>&1; then
              DOCKER_HOST=unix:///var/run/host-docker.sock docker image save "$$image" |
                DOCKER_HOST=tcp://docker-daemon-a:2375 docker image load
            else
              docker pull "$$image"
            fi
          fi
        done
    depends_on: !override
      docker-daemon-a:
        condition: service_healthy
    volumes: !override
      - /var/run/docker.sock:/var/run/host-docker.sock

  judge-images-b:
    build: .
    command:
      - sh
      - -ec
      - |
        for image in golang:1.25-alpine python:3.12-alpine gcc:13; do
          if ! docker image inspect "$$image" >/dev/null 2>&1; then
            if DOCKER_HOST=unix:///var/run/host-docker.sock docker image inspect "$$image" >/dev/null 2>&1; then
              DOCKER_HOST=unix:///var/run/host-docker.sock docker image save "$$image" |
                DOCKER_HOST=tcp://docker-daemon-b:2375 docker image load
            else
              docker pull "$$image"
            fi
          fi
        done
    environment:
      DOCKER_HOST: tcp://docker-daemon-b:2375
    depends_on:
      docker-daemon-b:
        condition: service_healthy
      judge-images:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/host-docker.sock
    restart: "no"

  executor:
    environment:
      DOCKER_HOST: tcp://docker-daemon-a:2375
      JUDGE_WORKDIR: /workspace/codingjudge-sandbox
    depends_on: !override
      judge-images:
        condition: service_completed_successfully
    volumes: !override
      - executor-a-work:/workspace/codingjudge-sandbox

  executor-b:
    build: .
    command: ["/app/executor"]
    environment:
      DOCKER_HOST: tcp://docker-daemon-b:2375
      EXECUTOR_ADDR: ":8090"
      EXECUTOR_TOKEN: "${EXECUTOR_TOKEN:-codingjudge-dev-executor-token}"
      EXECUTOR_MAX_CONCURRENCY: "${EXECUTOR_MAX_CONCURRENCY:-2}"
      EXECUTOR_SHUTDOWN_GRACE: "30s"
      JUDGE_WORKDIR: "/workspace/codingjudge-sandbox"
    depends_on:
      judge-images-b:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - executor-b-work:/workspace/codingjudge-sandbox
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 35s

  worker:
    environment:
      EXECUTOR_URLS: "http://executor:8090,http://executor-b:8090"
    depends_on: !override
      executor:
        condition: service_healthy
      executor-b:
        condition: service_healthy
      judge-images:
        condition: service_completed_successfully
      judge-images-b:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  prometheus:
    volumes: !override
      - ./deploy/prometheus/prometheus.multinode.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/prometheus.rules.yml:/etc/prometheus/prometheus.rules.yml:ro
      - prometheus-data:/prometheus

volumes:
  executor-a-docker:
  executor-a-work:
  executor-b-docker:
  executor-b-work:
