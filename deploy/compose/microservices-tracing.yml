# Opt-in local demo only: in-memory traces, UI restricted to loopback.
services:
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    ports: ["127.0.0.1:${CJ_TRACING_UI_PORT:-26686}:16686"]
  platform:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  judge-api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  worker:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  executor:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  executor-b:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
