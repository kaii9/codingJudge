global:
  scrape_interval: 1s
  evaluation_interval: 1s

rule_files:
  - /etc/prometheus/prometheus.rules.yml

scrape_configs:
  - job_name: codingjudge-api
    static_configs:
      - targets: [api:8080]

  - job_name: codingjudge-worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9091
        refresh_interval: 1s

  - job_name: codingjudge-executor
    dns_sd_configs:
      - names: [executor, executor-b]
        type: A
        port: 8090
        refresh_interval: 1s
