syntax = "proto3";
package gojudge.compat.executor;
option go_package="github.com/kaii9/codingJudge/api/compat/executor;legacyexecutor";
message Request {
 string language=1;
 string code=2;
 repeated string inputs=3;
 int32 time_limit_ms=4;
 int32 memory_limit_mb=5;
}
message Result {
 string stdout=1;
 string stderr=2;
 int32 exit_code=3;
 int64 duration_ms=4;
 bool timed_out=5;
 string stage=6;
}
message Response { repeated Result results=1; }
